name: Build/Test

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        otp_version: [28, 27, 26, 25, 24]
        os: ["ubuntu-latest"]
        include:
          - otp_version: 28
            rebar3_version: "3.25.1"
          - otp_version: 27
            rebar3_version: "3.25.1"
          - otp_version: 26
            rebar3_version: "3.25.1"
          - otp_version: 25
            rebar3_version: "3.24"
          - otp_version: 24
            rebar3_version: "3.21"

      fail-fast: false
      max-parallel: 2

    runs-on: ["${{ matrix.os }}"]

    name: "OTP${{ matrix.otp_version}}, rebar3 v${{ matrix.rebar3_version }}"

    steps:
    - uses: actions/checkout@v5
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp_version }}
        install-rebar: true
        install-hex: true
        rebar3-version: ${{ matrix.rebar3_version }}

    - name: Compile
      run: rebar3 compile
    - name: Run tests
      run: rebar3 eunit
